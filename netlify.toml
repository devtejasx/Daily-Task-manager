# Netlify config for the Vite SPA in frontend/
[build]
  command = "npm run build --workspace=frontend"
  publish = "frontend/dist"

# SPA fallback — serve index.html for every route
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev --workspace=frontend"
  port = 5173
